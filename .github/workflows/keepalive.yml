name: Keep API awake

# Render'ning free rejimi 15 daqiqa harakatsizlikdan keyin servisni uxlatadi
# (keyingi so'rov ~1 daqiqa kutadi). Bu workflow har 10 daqiqada health
# endpoint'ni uradi, shuning uchun API doim uyg'oq turadi.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          set -eu
          url="https://barberflow-api-8ptv.onrender.com/api/health/"
          for attempt in 1 2 3; do
            code=$(curl -sS -m 100 -o /tmp/health.txt -w '%{http_code}' "$url" || true)
            echo "attempt ${attempt}: HTTP ${code} $(cat /tmp/health.txt 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "health endpoint javob bermadi" >&2
          exit 1
